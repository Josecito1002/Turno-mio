<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi turno: creador y hoja de D&amp;D 2024</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEE8; --surface:#F9FAF6; --soft:#E1E5DE; --ink:#1D2830; --muted:#5B676D; --rule:#C9CFC8;
  --acc:#A8392F; --adi:#9C6410; --rea:#2C6A88; --gol:#6B4F96; --pas:#4F6B55; --warn:#9A5B00;
  --serif:"Alegreya", Georgia, "Times New Roman", serif;
  --sans:"Alegreya Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131B20; --surface:#1B252C; --soft:#25313A; --ink:#E3E7E1; --muted:#9BA7AA; --rule:#34414A;
    --acc:#E07A6E; --adi:#E0A546; --rea:#6FB1D2; --gol:#B29AE0; --pas:#8FB594; --warn:#E0A546;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131B20; --surface:#1B252C; --soft:#25313A; --ink:#E3E7E1; --muted:#9BA7AA; --rule:#34414A;
  --acc:#E07A6E; --adi:#E0A546; --rea:#6FB1D2; --gol:#B29AE0; --pas:#8FB594; --warn:#E0A546;
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);height:100%}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.45 var(--sans);-webkit-text-size-adjust:100%;min-height:100%}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 56px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rea);outline-offset:2px}

.bar{display:flex;align-items:center;gap:8px;padding:12px 0 4px;flex-wrap:wrap}
.brand{font:800 1.2rem/1 var(--serif);margin-right:auto}
.btn{font-weight:700;font-size:.95rem;background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:.5em .9em;min-height:42px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--rule)}
.btn.small{min-height:34px;padding:.3em .7em;font-size:.9rem}
select,input[type=number],input[type=text]{background:var(--surface);color:var(--ink);border:1.5px solid var(--rule);border-radius:8px;padding:.35em .5em;min-height:42px;max-width:100%}
label.check{display:inline-flex;align-items:center;gap:8px;min-height:42px;cursor:pointer}
label.check input{width:20px;height:20px;accent-color:var(--ink)}

.hero{padding:10px 0 14px}
.hero h1{font:800 clamp(2.2rem,10vw,3.3rem)/1 var(--serif);margin:0 0 8px;overflow-wrap:anywhere}
.who{margin:0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin-top:14px}
.stat{background:var(--surface);padding:10px 6px 8px;text-align:center}
.stat b{display:block;font:800 1.65rem/1.1 var(--serif)}
.stat span{font-size:.85rem;color:var(--muted)}
@media (min-width:620px){.stats{grid-template-columns:repeat(6,1fr)}}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;overflow-x:auto;background:var(--bg);margin:0 -16px;padding:8px 16px;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.tabs::-webkit-scrollbar{display:none}
@media (min-width:700px){.tabs{flex-wrap:wrap;overflow:visible}}
.res-in{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:8px;padding-top:8px;border-top:1px solid var(--soft)}
.res-in b{font:800 1.2rem var(--serif)}
.spg > summary .note{font-weight:400;margin-left:6px}
.tab{flex:none;font-weight:700;font-size:.97rem;background:transparent;color:var(--muted);border:0;border-radius:999px;padding:.45em 1em;min-height:40px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab .badge{display:inline-block;min-width:1.4em;margin-left:4px;padding:0 .35em;border-radius:999px;background:var(--warn);color:var(--bg);font-size:.8rem;line-height:1.4em;text-align:center}
.panel{display:none;padding-top:6px}
.panel.on{display:block}

.turn-key{display:flex;flex-wrap:wrap;gap:6px 16px;margin:14px 0 4px;color:var(--muted);font-size:.93rem}
.turn-key span{display:inline-flex;align-items:center;gap:6px}
.shape{display:inline-block;width:14px;height:14px;flex:none}
.s-accion{background:var(--acc);border-radius:50%}
.s-adicional{background:var(--adi);clip-path:polygon(50% 0,100% 100%,0 100%)}
.s-reaccion{background:var(--rea);transform:rotate(45deg) scale(.8)}
.s-gratis{border:2.5px solid var(--gol);border-radius:50%}
.s-pasiva{background:var(--pas);height:5px;border-radius:3px}
.s-fuera{border:2.5px solid var(--muted)}

.sec{margin:26px 0 6px}
.sec-h{display:flex;align-items:center;gap:10px;margin:0}
.sec-h h2{font:700 1.4rem/1.2 var(--serif);margin:0}
.sec-h .shape{width:16px;height:16px}
.sec-h .s-pasiva{height:6px}
.sec-d{margin:2px 0 8px 26px;color:var(--muted);font-size:.93rem}
.t-accion{--c:var(--acc)} .t-adicional{--c:var(--adi)} .t-reaccion{--c:var(--rea)}
.t-gratis{--c:var(--gol)} .t-pasiva{--c:var(--pas)} .t-fuera{--c:var(--muted)}

.ent{background:var(--surface);border-radius:10px;border-left:4px solid var(--c);padding:10px 12px;margin:8px 0}
.ent header{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.ent h3{font:700 1.1rem/1.25 var(--serif);margin:0}
.cost{font-size:.86rem;font-weight:700;color:var(--c)}
.ent p{margin:4px 0 0}
.src{font-size:.82rem;color:var(--muted)}

.atks{background:var(--surface);border-radius:10px;border-left:4px solid var(--acc);padding:2px 12px;margin:8px 0}
.atks-h{font-size:.9rem;color:var(--muted);padding:8px 0 0}
.atk{display:grid;grid-template-columns:1fr auto;column-gap:14px;padding:10px 0;border-top:1px solid var(--soft)}
.atks-h + .atk{border-top:0}
.atk-n{font:700 1.1rem/1.25 var(--serif)}
.atk-h{grid-column:2;grid-row:1 / span 2;align-self:center;text-align:right;font:800 1.5rem/1 var(--serif)}
.atk-h small{display:block;font:500 .78rem var(--sans);color:var(--muted)}
.atk-d{font-weight:700}
.atk-x{grid-column:1 / -1;font-size:.9rem;color:var(--muted);margin-top:2px}

.sp-list{background:var(--surface);border-radius:10px;border-left:4px solid var(--c);padding:2px 12px;margin:8px 0}
.sp{border-top:1px solid var(--soft)}
.sp:first-child{border-top:0}
.sp summary{display:flex;justify-content:space-between;align-items:baseline;gap:12px;cursor:pointer;list-style:none;padding:10px 0;min-height:44px}
.sp summary::-webkit-details-marker{display:none}
.sp-n{font:700 1.05rem/1.25 var(--serif)}
.sp-k{font-size:.88rem;color:var(--muted);text-align:right}
.sp-body{font-size:.96rem;padding:0 0 12px}
.sp-body p{margin:0 0 6px}

details.more{margin:8px 0;background:var(--soft);border-radius:10px;padding:0 12px}
details.more > summary{cursor:pointer;padding:10px 0;font-weight:700;min-height:44px}
details.more .ent{background:var(--surface)}

.res{background:var(--surface);border-radius:12px;padding:6px 12px 12px;margin-top:10px}
.res h2{font:700 1.2rem var(--serif);margin:6px 0 2px}
.res-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 0;border-top:1px solid var(--soft)}
.res h2 + .res-row{border-top:0}
.res-n{flex:1 1 170px}
.res-n small{display:block;color:var(--muted);font-size:.82rem}
.pips{display:flex;flex-wrap:wrap;gap:8px}
.pip{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--ink);background:var(--ink);padding:0;cursor:pointer}
.pip.used{background:transparent}
.pool{display:flex;align-items:center;gap:6px}
.pool input{width:4.4em;text-align:center}
.pool .of{color:var(--muted)}
.rests{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:620px){.grid6{grid-template-columns:repeat(6,1fr)}}
.ab{background:var(--surface);border-radius:10px;padding:10px 6px;text-align:center}
.ab b{display:block;font:800 1.6rem/1.1 var(--serif)}
.ab span{display:block;font-size:.85rem;color:var(--muted)}
.list{background:var(--surface);border-radius:10px;padding:2px 12px}
.li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--soft)}
.li:first-child{border-top:0}
.li b{font-variant-numeric:tabular-nums}
.li .pr{font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink);margin-right:6px;vertical-align:middle}
.dot.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--rule)}
h2.plain{font:700 1.35rem var(--serif);margin:26px 0 8px}
.kv{margin:0}
.kv div{padding:6px 0;border-top:1px solid var(--soft)}
.kv div:first-child{border-top:0}
.kv dt{font-weight:700;display:inline}
.kv dd{display:inline;margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.fix{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fix label{display:flex;flex-direction:column;font-size:.88rem;color:var(--muted)}
.fix input{width:100%}

.warn{background:var(--surface);border-left:4px solid var(--warn);border-radius:10px;padding:10px 12px;margin:8px 0}
.warn.info{border-left-color:var(--muted)}
.warn b{display:block;font-family:var(--serif);font-size:1.05rem}
.note{color:var(--muted);font-size:.93rem}

.empty{padding:28px 0}
.empty h1{font:800 clamp(2.2rem,9vw,3rem)/1.05 var(--serif);margin:0 0 12px}
.empty p{max-width:36em}
.steps{padding-left:1.2em}
.steps li{margin:6px 0}
.drop{border:2px dashed var(--rule);border-radius:14px;padding:22px 16px;margin:20px 0;text-align:center}
.drop.over{border-color:var(--rea);background:var(--surface)}
.econ{display:grid;gap:8px;margin-top:22px}
.econ div{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:10px;padding:10px 12px}
.econ .shape{margin-top:5px}

.toast{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--bg);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));text-align:center;display:none}
.toast.on{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media print{
  :root{--bg:#fff;--surface:#fff;--soft:#ddd;--ink:#000;--muted:#444;--rule:#bbb;color-scheme:light}
  .bar,.tabs,.rests,.no-print,.toast{display:none!important}
  .panel{display:block!important}
  .ent,.atks,.sp-list,.res,.warn,.list{break-inside:avoid;border:1px solid #bbb}
  details.more{background:#fff}
  body{font-size:12pt}
}

.brand{background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
#barR{display:flex;gap:8px}
.cards,.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:8px 0}
.card{text-align:left;background:var(--surface);border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:64px}
.card b{display:block;font:700 1.08rem/1.2 var(--serif)}
.card span{display:block;font-size:.85rem;color:var(--muted);margin-top:2px}
.card.on{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.form{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.form label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.95rem}
.form label.check{flex-direction:row;font-weight:400}
.form .row label{flex:1 1 140px}
textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--rule);border-radius:8px;padding:.5em;width:100%}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.segb{font-weight:700;background:var(--surface);border:1.5px solid var(--rule);border-radius:999px;padding:.45em 1em;min-height:42px;cursor:pointer}
.segb.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.chip{display:flex;flex-direction:column;align-items:center;min-width:64px;padding:8px 10px;background:var(--surface);border:2px solid var(--rule);border-radius:12px;cursor:pointer}
.chip b{font:800 1.6rem/1 var(--serif)}
.chip small{font-size:.75rem;color:var(--muted)}
.chip.sel{border-color:var(--rea);background:var(--rea);color:var(--bg)}
.chip.sel small{color:var(--bg)}
.chip.used{opacity:.55}
.slot{background:var(--surface);border:2px dashed var(--rule);border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer;min-height:70px}
.slot span{display:block;font-size:.85rem;color:var(--muted)}
.slot b{display:block;font:800 1.6rem/1.1 var(--serif)}
.slot.full{border-style:solid}
.slot.ready{border-color:var(--rea)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0 12px}
.check.dim{color:var(--muted)}
.mj{background:var(--surface);border-radius:10px;padding:10px 12px;margin:8px 0}
.mj .form{margin:6px 0 0}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:28px}
.tip{margin:10px 0 0}
.rb{font:inherit;font-weight:700;color:inherit;background:var(--soft);border:0;border-radius:7px;padding:.2em .5em;cursor:pointer;min-height:34px}
.rb:hover{background:var(--rule)}
.rb.inline{min-height:0;padding:0 .3em;background:var(--soft);box-shadow:inset 0 -2px 0 var(--c,var(--rea))}
.rb.big{font:800 1.45rem/1 var(--serif);padding:.25em .5em;background:var(--ink);color:var(--bg);min-height:46px}
.rb.statb{background:transparent;width:100%;padding:0;min-height:0}
.rb.statb span{font-size:.85rem;color:var(--muted);font-weight:400}
.rb.statb b{display:block;font:800 1.65rem/1.1 var(--serif);text-decoration:underline dotted 2px;text-underline-offset:4px}
.rb.abtn{display:block;width:100%;background:transparent;padding:0}
.rb.abtn span{display:block;font-size:.85rem;color:var(--muted);font-weight:400}
.rb.abtn b{display:block;font:800 1.6rem/1.1 var(--serif)}
.rb.svbtn{margin-top:6px;font-size:.88rem;width:100%}
.rb.li{display:flex;width:100%;justify-content:space-between;background:transparent;border-radius:0;border-top:1px solid var(--soft);padding:8px 0;font-weight:400;text-align:left}
.rb.li:first-child{border-top:0}
.rb.wide{padding:.4em .9em}
.sp-btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 0 10px}
.tag{font-size:.88rem;font-weight:700;padding:.3em .5em;border-radius:7px;box-shadow:inset 0 0 0 1.5px var(--rule)}
.sp details summary{display:flex;justify-content:space-between;align-items:baseline;gap:12px;cursor:pointer;list-style:none;padding:10px 0;min-height:44px}
.sp details summary::-webkit-details-marker{display:none}
.dice-back{position:fixed;inset:0;background:rgba(8,12,15,.45);z-index:30}
.dice{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:760px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.dice[hidden],.dice-back[hidden]{display:none}
.dice-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dice-l{margin:0;font:700 1.15rem var(--serif)}
.x{background:transparent;border:0;font-size:1.6rem;line-height:1;cursor:pointer;color:var(--muted);min-width:42px;min-height:42px}
.dice-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;min-height:84px;align-items:center;margin:10px 0}
.die{width:76px;height:76px;transform-origin:50% 50%;overflow:visible}
.die.sm{width:50px;height:50px}
.die polygon,.die rect{fill:var(--dc);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.die .ln{fill:none;stroke:var(--bg);stroke-opacity:.35;stroke-width:2}
.die polyline.ln{fill:none}
.die text{fill:var(--bg);font:800 34px var(--serif)}
.die.d20{--dc:var(--rea)} .die.dmg{--dc:var(--acc)} .die.neu{--dc:var(--pas)}
.die.dropped{opacity:.28}
.die.min3 polygon,.die.min3 rect{stroke:var(--adi);stroke-width:6}
.die.rolling{animation:tumble .77s cubic-bezier(.2,.7,.3,1)}
@keyframes tumble{0%{transform:rotate(-260deg) scale(.45)}65%{transform:rotate(18deg) scale(1.1)}100%{transform:rotate(0) scale(1)}}
.dice-total{text-align:center}
.dice-total b{display:block;font:800 3.4rem/1 var(--serif)}
.dice-total span{display:block;color:var(--muted);margin-top:4px}
.dice-total em{display:block;font-style:normal;font-weight:800;margin-top:4px}
.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(.5)}100%{transform:scale(1)}}
.nat20{color:var(--adi)} .nat1{color:var(--acc)}
.dice-btns{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px 0 6px}
.dice-h{margin-top:8px;font-size:.93rem}
.dice-h summary{cursor:pointer;color:var(--muted);min-height:36px;padding:6px 0}
.dice-h ol{margin:0;padding-left:1.4em}
.spc{display:grid;grid-template-columns:1fr auto;align-items:start;gap:8px;border-top:1px solid var(--soft);padding:2px 0}
.spc:first-child{border-top:0}
.spc > .btn{margin-top:8px}
.spc.mine .sp-n::after{content:" ✓";color:var(--pas)}
.spc summary{display:flex;flex-direction:column;cursor:pointer;list-style:none;padding:10px 0;min-height:44px}
.spc summary::-webkit-details-marker{display:none}
.spc .sp-k{text-align:left}
.sub-h{font:700 1.1rem var(--serif);margin:18px 0 4px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.levelup{background:var(--surface);border-left:4px solid var(--adi);border-radius:12px;padding:10px 14px;margin-top:10px}
.levelup h2{font:800 1.5rem var(--serif);margin:4px 0}
.levelup p{margin:6px 0}
input[type=search]{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--rule);border-radius:8px;padding:.35em .6em;min-height:42px;width:100%}
.card.esp img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px;margin-bottom:8px;background:var(--soft)}
.card .d{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.esp-info{display:flex;flex-wrap:wrap;gap:14px;background:var(--surface);border-radius:12px;padding:14px;margin:16px 0}
.esp-info > img.foto{width:140px;height:140px;object-fit:cover;border-radius:10px;flex:none}
.esp-info > .info{flex:1 1 220px}
.crop{display:flex;flex-direction:column;gap:6px;flex:none}
.crop-box{position:relative;overflow:hidden;width:min(260px,72vw);aspect-ratio:1;border-radius:10px;background:var(--soft);touch-action:none;cursor:grab;box-shadow:inset 0 0 0 2px var(--rea)}
.crop-box:active{cursor:grabbing}
.crop-box img{position:absolute;max-width:none;user-select:none;pointer-events:none}
.crop-z{display:flex;align-items:center;gap:8px;font-size:.9rem}
.crop-z input{flex:1}
input[type=password]{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--rule);border-radius:8px;padding:.35em .6em;min-height:40px}
.esp-info p{margin:4px 0}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-top:14px}
.mcard,.mrow{background:var(--surface);border-radius:12px;padding:12px;border-left:4px solid var(--rea)}
.mcard header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mcard h3{font:700 1.25rem/1.2 var(--serif);margin:0}
.mcard .note{margin:2px 0 0}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}

const TIEMPO_N = {accion:'Acción', adicional:'Acción adicional', reaccion:'Reacción', fuera:'1 minuto o más'};
/* Trucos y conjuros preparados por nivel (2024) */
const TRUCOS_T = {bardo:[2,3,4], clerigo:[3,4,5], druida:[2,3,4], hechicero:[4,5,6], brujo:[2,3,4], mago:[3,4,5]};
const PREP_T = {
  full:[4,5,6,7,9,10,11,12,14,15,16,16,17,17,18,18,19,20,21,22],
  hechicero:[2,4,6,7,9,10,11,12,14,15,16,16,17,17,18,18,19,20,21,22],
  brujo:[2,3,4,5,6,7,8,9,10,10,11,11,12,12,13,13,14,14,15,15],
  mago:[4,5,6,7,9,10,11,12,14,15,16,16,17,18,19,21,22,23,24,25],
  half:[2,3,4,5,6,6,7,7,9,9,10,10,11,11,12,12,14,14,15,15],
};
function trucosN(clase, l){ if (clase === 'artifice') return l >= 14 ? 4 : l >= 10 ? 3 : 2; const t = TRUCOS_T[clase]; return t ? (l >= 10 ? t[2] : l >= 4 ? t[1] : t[0]) : 0; }
function prepN(clase, l){

}

function aprenderBuilder(d){

    if (!bk) LIB.clases[key] = {...libClaseDeBuilder(cls), subclases: LIB.clases[key]?.subclases || {}};
    LIB.clases[key] = LIB.clases[key] || {subclases:{}};
    if (bk) {
      const altos = (cls.rasgos_clase_detalles || []).filter(r => (+r.nivel || 1) > CLASES[bk].hasta).map(r => rasgoDe(r, +r.nivel || 1));
      if (altos.length) LIB.clases[key].rasgosAltos = altos;
    }
    (cls.subclases || []).forEach(s => {
      const sn = norm(s.nombre || s.name);
      const bsub = bk ? SUBCLASES.find(b => b.clase === bk && b.match.test(sn)) : null;
      if (bsub) {
        const alt = (s.rasgos || []).filter(r => (+r.nivel || 3) > bsub.hasta).map(r => rasgoDe(r, +r.nivel || 3));
        if (alt.length) { LIB.clases[key].subAltos = LIB.clases[key].subAltos || {}; LIB.clases[key].subAltos[bsub.key] = alt; }
        return;
      }
      const sk = slug(s.id || s.nombre || s.name);
      if (!LIB.clases[key].subclases[sk]) nuevo.push(`subclase ${s.nombre || s.name}`);
      LIB.clases[key].subclases[sk] = {n: s.nombre || s.name, rasgos: (s.rasgos || []).map(r => rasgoDe(r, +r.nivel || 3))};
    });
  }
  if (d.race && !especieBuiltin(d.race)) { const k = libKey(d.race); if (!LIB.especies[k]) nuevo.push(`especie ${d.race.nombre || d.race.name}`); LIB.especies[k] = libEspecieDeBuilder(d.race); }
  const bg = d.background;
  if (bg && (bg.nombre || bg.name) && !trasfondoBuiltin(bg)) {
    const k = libKey(bg); if (!LIB.trasfondos[k]) nuevo.push(`trasfondo ${bg.nombre || bg.name}`);
    const abs = (bg.bonos_caracteristica || []).map(abKey).filter(Boolean);
    LIB.trasfondos[k] = {n: bg.nombre || bg.name, lib:true, ab: [abs[0] || 'fue', abs[1] || 'des', abs[2] || 'con'], habs: (bg.competencia_habilidades || []).slice(0, 2), herr: bg.tool_proficiency_final || bg.competencia_herramienta || '', dote: doteKey(bg.dote_origen_id) || (bg.dote_origen_id ? 'lib:' + slug(bg.dote_origen_id) : '')};

  (d.spells || []).forEach(s => {
    const n = s.nombre || s.name; if (!n || CATALOGO.some(x => norm(x.nombre) === norm(n))) return;

  c.entries.filter(e => /^conjuros/.test(norm(e.nombre)) && e.texto.includes(':')).forEach(e => e.texto.split(':').slice(1).join(':').split(',').forEach(n => c.siempre.add(norm(n.replace(/\.$/, '')))));
  c.esExtra = s => !!s.extra || c.siempre.has(norm(s.nombre));
  c.nivelMax = pj.clase === 'brujo' ? pacto(lvl).nivel : (c.slots.length ? Math.max(...c.slots.map(s => s.nivel)) : 0);
  const conLimite = C?.lanz && !C.lib;
  c.trucosMax = conLimite ? trucosN(pj.clase, lvl) : null;
  c.prepMax = conLimite ? prepN(pj.clase, lvl) : null;
  c.trucosUsados = (pj.conjuros || []).filter(s => !+s.nivel && !c.esExtra(s)).length;
  c.prepUsados = (pj.conjuros || []).filter(s => +s.nivel > 0 && !c.esExtra(s)).length;
  aplicarTextos(c);
  c.entries.forEach(e => { if (e.textoF) e.texto = e.textoF(c); if (e.rollF) e.roll = e.rollF(c); });
  vincularRecursos(c);
  separarOpciones(c);
  c.entries.forEach(e => { e.tAuto = e.tAuto || e.t; const k = norm(e.nombre); e.t = pj.tipos?.[k] || LIB.tipos?.[k] || e.t; });
  c.avisos = buildAvisos(c);
  return c;
}

/* Lee los textos de rasgos para sacar lo que tiene efecto en la hoja */
const ARMA_NATURAL = /garra|mordi|mordisco|cuerno|cabeza|arma natural|fauces|patada|casco|pico|cola|topetazo|pu[nñ]o/;
const avgDado = d => { const [n, s] = d.split('d').map(Number); return n * (s + 1) / 2; };
function aplicarTextos(c){
  const m = c.m;
  // Dado de golpe sin armas que da la clase (pugilistas y similares)
  let dadoClase = c.isMonk ? `1d${c.md}` : null;
  if (!c.isMonk) {
    let mejor = c.dadoReglas || null;
    if (!mejor) c.entries.filter(e => e.grupo === 'clase' || e.grupo === 'sub').forEach(e => {
      String(e.texto).split(/(?<=[.;])\s+/).forEach(s => { const ns = norm(s); if (/desarmad|sin armas/.test(ns)) { const d = s.match(/\d+d\d+/); if (d && (!mejor || avgDado(d[0]) > avgDado(mejor))) mejor = d[0]; } });
    });
    if (mejor) { dadoClase = mejor; const uMod = m.fue; c.unarmed = {atk: c.pb + uMod, expr: `${mejor}${modStr(uMod)}`, dmg: `${mejor}${fmtMod(uMod)} contundente`}; }
  }
  // Armas naturales (garras, cuernos, mordisco): en las reglas actuales son golpes sin armas con otro daño
  c.naturales = [];
  c.entries.filter(e => e.grupo === 'especie' || e.grupo === 'extra').forEach(e => {
    const frases = String(e.texto).split(/(?<=[.;])\s+/);
    const f = frases.find(s => ARMA_NATURAL.test(norm(s)) && /\d+d\d+/.test(s)); if (!f) return;
    const nf = norm(f);
    let dado = f.match(/\d+d\d+/)[0], nota = '';
    if (dadoClase && avgDado(dadoClase) > avgDado(dado)) { nota = ` Usa tu dado de ${c.isMonk ? 'Artes Marciales' : 'clase'} (${dadoClase}) en vez de ${dado}.`; dado = dadoClase; }
    const ab = c.isMonk ? (m.des > m.fue ? 'des' : 'fue') : (/destreza|\bdes\b/.test(nf) && !/fuerza|\bfue\b/.test(nf) ? 'des' : 'fue');
    const tipo = (nf.match(/cortante|perforante|contundente/) || ['contundente'])[0];
    const mod = m[ab];
    c.naturales.push({nombre: `Golpe sin armas: ${e.nombre}`, atk: c.pb + mod, expr: `${dado}${modStr(mod)}`, dmg: `${dado}${fmtMod(mod)} ${tipo}`,
      notas: [`Cuenta como golpe sin armas: lo usas con Atacar y con todo lo que te dé golpes sin armas extra${/accion adicional/.test(nf) ? '. Este rasgo además te deja hacerlo con acción adicional' : ''}${nota ? '. ' + nota.trim().replace(/\.$/, '') : ''}`]});
  });
  // CA natural o sin armadura descrita en rasgos (Mentón de Hierro, Armadura Natural, Caparazón)
  if (!c.armor) {
    const MOD = {destreza:'des', constitucion:'con', sabiduria:'sab', fuerza:'fue', carisma:'car', inteligencia:'int', des:'des', con:'con', sab:'sab', fue:'fue', car:'car'};
    c.entries.forEach(e => {
      const t = norm(e.texto), x = t.match(/\bca\b[^.]*?\b(\d{2})\b(?:\s*\+\s*(?:tu\s+)?(?:modificador de\s+)?(destreza|constitucion|sabiduria|fuerza|carisma|des|con|sab)\b)?/);
      if (!x || +x[1] < 10 || +x[1] > 20) return;
      const sinEscudo = /ni escudo|sin escudo/.test(t);
      if (sinEscudo && c.shield) return;
      const v = +x[1] + (x[2] ? m[MOD[x[2]]] : 0) + (c.shield ? 2 : 0);
      if (v > c.ac) c.ac = v;
    });
  }
}
/* Rasgos que listan opciones ("Puedes gastarlos para usar: A (...), B (...)") se separan en entradas propias */
const TIPOS_CONOCIDOS = {'alistate': 'adicional', 'el viejo uno-dos': 'adicional', 'pegar y moverse': 'adicional'};
function separarOpciones(c){
  const salida = [];
  c.entries.forEach(e => {
    salida.push(e);
    if (e.noSplit) return;
    const m = typeof e.texto === 'string' && e.texto.match(/(?:para usar|puedes usar|opciones|puedes elegir(?: entre)?)\s*:\s*(.+)$/i);
    if (!m) return;
    const items = [...m[1].matchAll(/([^,()]+?)\s*\(([^)]*)\)/g)].map(x => ({n: x[1].replace(/^\s*(y|o)\s+/i, '').trim(), d: x[2].trim()})).filter(x => x.n && x.n.length < 40);
    if (items.length < 2) return;
    e.t = e.tAuto = 'pasiva';
    const r = e.recurso && c.recursos.find(x => x.id === e.recurso);
    const corto = r ? ((r.nombre.match(/\(([^)]+)\)/) || [])[1] || r.nombre) : '';
    items.forEach(it => {
      const t = TIPOS_CONOCIDOS[norm(it.n).replace(/[¡!¿?]/g, '').trim()] || clasificar(it.d);
      salida.push({t, tAuto:t, nombre: it.n, texto: it.d, raw:true, coste: corto ? `1 de ${corto}` : '', src: e.nombre, grupo: e.grupo, recurso: e.recurso, opcion:true});
    });
  });
  c.entries = salida;
}
/* Une cada recurso con el rasgo que lo gasta, para mostrarlo junto a él */
function vincularRecursos(c){
  const IGNORAR = new Set(['puntos','espacios','espacio','nivel','sin','usos','descanso','gratis']);
  const kws = c.recursos.filter(r => r.id !== 'pg' && !/^slot/.test(r.id) && !r.solo).map(r => ({r, kw: norm(r.nombre).replace(/[()]/g, ' ').split(/\s+/).filter(w => w.length > 3 && !IGNORAR.has(w))}));
  c.entries.forEach(e => {
    if (e.recurso) return;
    const t = norm(e.nombre + ' ' + (e.coste || ''));
    let best = null, score = 0;
    kws.forEach(({r, kw}) => { const s = kw.filter(w => t.includes(w)).length; if (s > score) { best = r; score = s; } });
    if (best) e.recurso = best.id;
  });
}
function weaponRow(a, c){
  const w = ARMAS[a.k], m = c.m, pj = c.pj;
  const monkW = c.isMonk && !w.dist && (w.cat === 'sencilla' || w.p.includes('ligera'));
  let ab = w.dist ? 'des' : 'fue';
  if (w.p.includes('sutil') || monkW) ab = m.des > m.fue ? 'des' : 'fue';
  const P = c.wProf;
  const prof = w.cat === 'sencilla' ? !!P.simple : (!!P.martial && (!P.light || w.p.includes('ligera')) && (!P.finesseLight || w.p.includes('ligera') || w.p.includes('sutil')));
  const atk = m[ab] + (prof ? c.pb : 0) + (c.estilo === 'arqueria' && w.dist ? 2 : 0);
  let dado = w.d;
  if (monkW) { const [nn, dd] = w.d.split('d').map(Number); if (nn === 1 && c.md > dd) dado = `1d${c.md}`; }
  const dmgMod = m[ab] + (c.estilo === 'duelo' && !w.dist && !w.p.includes('dos manos') ? 2 : 0);
  const min3 = c.estilo === 'dosmanos' && !w.dist && (w.p.includes('dos manos') || w.p.includes('versátil'));
  const notas = [];
  if (w.r) notas.push(`${w.p.includes('arrojadiza') ? 'Arrojadiza' : 'Alcance'} ${w.r} pies`);
  if (w.p.includes('alcance')) notas.push('Alcance de 10 pies');
  if (!prof) notas.push('Sin competencia');
  let maestria = null;
  if (c.hasMastery && (pj.maestrias || []).includes(a.k) && w.ma) {
    const [mn, md] = MAESTRIAS[w.ma];
    maestria = `${mn}: ${md}${w.ma === 'derribar' ? ` CD ${8 + m[ab] + c.pb}.` : ''}`;
  }
  return {k:a.k, q:a.q, i:a.i, w, nombre: w.n + (a.q > 1 ? ` (${a.q})` : ''), atk, expr:`${dado}${modStr(dmgMod)}`, dmg:`${dado}${fmtMod(dmgMod)} ${w.tipo}`,
    v: w.v ? {expr:`${w.v}${modStr(dmgMod)}`, dmg:`${w.v}${fmtMod(dmgMod)}`} : null, notas, maestria, min3};
}

function evalR(r, c, src, grupo){
  const fn = typeof r.texto === 'function';
  return {t:r.t || 'pasiva', nombre:r.nombre, coste: typeof r.coste === 'function' ? r.coste(c) : r.coste, texto: fn ? r.texto(c) : (r.texto || ''), raw: !fn, src, grupo, roll: r.roll ? r.roll(c) : null};
}
function usoTxt(max, reset){ return `${max} uso${max > 1 ? 's' : ''} por descanso ${reset === 'corto' ? 'corto' : 'largo'}`; }

function buildEntries(c){
  const E = [], pj = c.pj;
  c.extraRes = [];
  const pushR = (r, src, grupo, pre) => {
    const e = evalR(r, c, src, grupo);
    if (typeof r.texto === 'string' && !r.manual && (r.auto || ['clase','sub','especie'].includes(grupo))) e.t = clasificar(r.texto);
    e.tAuto = e.t;
    if (r.usos) { const max = r.usos === 'pb' ? c.pb : +r.usos; if (max) { e.coste = e.coste || usoTxt(max, r.reset); c.extraRes.push({id:pre + '-' + slug(r.nombre), nombre:r.nombre, max, reset:r.reset || 'largo'}); } }
    E.push(e);
  };
  if (c.C) [...c.C.rasgos, ...(getAltos(pj, pj.clase) || [])].filter(r => (+r.n || 1) <= c.lvl).forEach(r => pushR(r, c.C.n, 'clase', 'c'));
  [c.SD, c.chain].filter(Boolean).forEach(S => [...S.rasgos, ...(getSubAltos(pj, pj.clase, S.key) || [])].filter(r => (+r.n || 1) <= c.lvl).forEach(r => pushR(r, S.n, 'sub', 's')));
  const yaEstan = new Set(E.map(e => norm(e.nombre)));
  if (c.E) c.E.rasgos.forEach(r => {
    if (r.sub && r.sub !== c.esub) return;
    if (r.n && r.n > c.tl) { c.futuros.push({nombre:r.nombre, nivel:r.n}); return; }
    pushR(r, c.E.subs?.[c.esub]?.n || c.E.n, 'especie', 'e');
  });
  if (c.estilo && ESTILOS[c.estilo]) { const [n, t, txt] = ESTILOS[c.estilo]; E.push({t, nombre:`Estilo: ${n}`, texto:txt, src:'Estilo de combate', grupo:'clase'}); }
  c.dotes.forEach(d => {
    if (d.key) { const D = getD(pj, d.key); pushR({...D, nombre:D.n, t:D.t || 'pasiva'}, d.src, 'dote', 'd'); }
    else E.push({t:d.t || 'pasiva', nombre:d.nombre, texto:d.texto, raw:true, src:d.src, grupo:'dote'});
  });
  (pj.rasgosExtra || []).forEach((r, i) => {
    if (yaEstan.has(norm(r.nombre))) return;
    if ((+r.n || 1) > c.tl) { c.futuros.push({nombre:r.nombre, nivel:+r.n}); return; }
    pushR(r, 'Rasgo propio', 'extra', 'x' + i);
  });
  if (c.lightCount >= 2) E.push({t:'adicional', nombre:'Ataque con la otra arma ligera', src:'Reglas', grupo:'reglas',
    texto:`Si atacaste con un arma Ligera, atacas con otra distinta.${c.estilo === 'dosarmas' ? ' Sumas tu modificador al daño.' : ' No sumas tu modificador al daño salvo que sea negativo.'}`});
  return E;
}

function buildRecursos(c){
  const R = [{id:'pg', nombre:'Puntos de golpe', max:c.hpMax, reset:'largo', tipo:'pool'}];
  if (typeof c.C?.recursos === 'function') c.C.recursos(c).filter(Boolean).forEach(r => R.push(r));
  else if (c.C?.recursosTabla) Object.entries(c.C.recursosTabla[c.lvl - 1] || {}).forEach(([k, v]) => {
    if (!(v > 0)) return;
    const rasgo = c.C.rasgos.find(r => norm(r.nombre).includes(norm(k).replace(/_/g, ' ')));
    const t = norm(rasgo?.texto || '');
    R.push({id:'t-' + k, nombre: rasgo ? rasgo.nombre : cap(k.replace(/_/g, ' ')), max:v, reset: /descanso corto/.test(t) ? 'corto' : 'largo', tipo: v > 6 ? 'pool' : 'pips'});
  });
  [c.SD, c.chain].forEach(S => { if (typeof S?.recursos === 'function') S.recursos(c).filter(Boolean).forEach(r => R.push(r)); });
  c.slots.forEach(s => R.push({id:'slot' + s.nivel, nombre:`Espacios de nivel ${s.nivel}`, max:s.n, reset:'largo'}));
  c.extraRes.forEach(r => { if (!R.some(x => x.id === r.id)) R.push(r); });
  return R;
}

function buildAvisos(c){
  const A = [], pj = c.pj, C = c.C;
  const falta = (t, txt, paso) => A.push({nivel:'aviso', t, txt, paso});
  if (!c.E) falta('Falta la especie', 'Elige una especie.', 'especie');
  else if (c.E.subs && !c.esub) falta(`Falta ${c.E.subL.toLowerCase()}`, `Elige ${c.E.subL.toLowerCase()} de ${c.E.n.toLowerCase()}.`, 'especie');
  if (!C) falta('Falta la clase', 'Elige una clase.', 'clase');
  if (!c.T) falta('Falta el trasfondo', 'Elige un trasfondo.', 'trasfondo');
  else if (pj.trasfondo.modo !== '111' && (!pj.trasfondo.a || !pj.trasfondo.b)) falta('Bonificadores del trasfondo', 'Elige a qué características van el +2 y el +1.', 'trasfondo');
  const g = pj.gen;
  if ((g.metodo === 'tirar' || g.metodo === 'estandar') && Object.keys(g.asig || {}).length < 6) falta('Características sin asignar', 'Asigna un valor a cada característica.', 'stats');
  if (g.metodo === 'compra') { const gasto = AB.reduce((s, [k]) => s + (COMPRA[g.compra[k]] || 0), 0); if (gasto > 27) falta('Compra de puntos', `Gastaste ${gasto} de 27 puntos.`, 'stats'); }
  c.asiLv.forEach(L => { const mj = pj.mejoras?.[L];
    if (!mj || (mj.modo === 'una' && !mj.a) || (mj.modo === 'dos' && (!mj.a || !mj.b)) || (mj.modo === 'dote' && !mj.nombre && !mj.key)) falta(`Mejora de nivel ${L}`, 'Elige +2 a una característica, +1 a dos, o una dote.', 'stats'); });
  if (C) {
    if ((pj.habClase || []).length < C.habN) falta('Habilidades de clase', `Te faltan ${C.habN - pj.habClase.length} por elegir.`, 'habs');
    const pn = periciaN(pj.clase, c.lvl); if ((pj.pericia || []).length < pn) falta('Pericia', `Elige ${pn - (pj.pericia || []).length} habilidad(es) con pericia.`, 'habs');
    if (c.lvl >= c.subNivel && !pj.subclase && getSubs(pj, pj.clase).some(s => s.key !== 'cadena')) falta('Falta la subclase', `A nivel ${c.subNivel} eliges subclase.`, 'clase');
    if (C.estilo && c.lvl >= C.estilo && !pj.estilo) falta('Estilo de combate', 'Elige tu estilo de combate.', 'clase');
    if (C.maestrias && (pj.maestrias || []).length < C.maestrias) falta('Maestría con armas', `Elige ${C.maestrias} tipos de armas.`, 'equipo');
    if (C.hasta && c.lvl > C.hasta && !getAltos(pj, pj.clase)) A.push({nivel:'info', t:'Rasgos de nivel alto', txt:`Los rasgos de ${C.n.toLowerCase()} están cargados hasta nivel ${C.hasta}. Agrega los de niveles superiores en Rasgos propios.`, paso:'rasgos'});
    if (c.lvl >= c.subNivel && pj.subclase === 'otra') A.push({nivel:'info', t:'Subclase propia', txt:'Sus rasgos van en Rasgos propios, con su tipo de acción.', paso:'rasgos'});
    else if (c.SD && c.SD.hasta && c.lvl > c.SD.hasta && !getSubAltos(pj, pj.clase, c.SD.key)) A.push({nivel:'info', t:'Rasgos de subclase', txt:`${c.SD.n} está cargada hasta nivel ${c.SD.hasta}.`, paso:'rasgos'});
  }
  const extraN = (pj.especie.key === 'humano' ? 1 : 0) + (pj.especie.key === 'elfo' ? 1 : 0) + 3 * c.dotes.filter(d => d.key === 'habil').length + (pj.clase === 'barbaro' && c.lvl >= 3 ? 1 : 0);
  if ((pj.habExtra || []).length > extraN) A.push({nivel:'info', t:'Habilidades de más', txt:`Tiene ${pj.habExtra.length} habilidades extra y le tocan ${extraN}. Si las dio tu DM, ignora esto.`, paso:'habs'});
  if (c.trucosMax != null) {
    if (c.trucosUsados > c.trucosMax) A.push({nivel:'aviso', t:'Demasiados trucos', txt:`Tiene ${c.trucosUsados} y a nivel ${c.lvl} le tocan ${c.trucosMax}.`, paso:'conjuros'});
    else if (c.trucosUsados < c.trucosMax) A.push({nivel:'info', t:'Trucos por elegir', txt:`Puede aprender ${c.trucosMax - c.trucosUsados} más.`, paso:'conjuros'});
  }
  if (c.prepMax != null) {
    if (c.prepUsados > c.prepMax) A.push({nivel:'aviso', t:'Demasiados conjuros', txt:`Tiene ${c.prepUsados} preparados y a nivel ${c.lvl} le tocan ${c.prepMax}.`, paso:'conjuros'});
    else if (c.prepUsados < c.prepMax) A.push({nivel:'info', t:'Conjuros por preparar', txt:`Puede preparar ${c.prepMax - c.prepUsados} más.`, paso:'conjuros'});
  }
  if (!c.armas.length) A.push({nivel:'aviso', t:'Sin armas', txt:`Solo aparece el golpe sin armas.${C?.equipo ? ` El equipo inicial trae ${C.equipo.txt}.` : ''}`, paso:'equipo'});
  if (c.armor?.fue && c.sc.fue < c.armor.fue) A.push({nivel:'aviso', t:'Armadura muy pesada', txt:`${c.armor.n} pide FUE ${c.armor.fue}: velocidad −10 pies.`, paso:'equipo'});
  if (c.futuros.length) A.push({nivel:'info', t:'Llegan más adelante', txt: c.futuros.map(f => `${f.nombre} (nivel ${f.nivel})`).join(', ') + '.'});
  return A;
}


/* ============ Reglas revisadas ============
   Cada entrada corrige un rasgo que el texto del builder deja ambiguo.
   n: nombre del rasgo (regex sobre el nombre normalizado)
   de: de dónde viene (regex sobre la clase, subclase o especie)
   t: dónde se usa; texto: explicación clara; coste; roll: [ataque, daño]
   opciones: rasgos que salen de este; usos/reset: recurso propio
   dado: dado de golpe sin armas que da el rasgo */
const dadoPug = c => c.lvl >= 17 ? '1d12' : c.lvl >= 11 ? '1d10' : c.lvl >= 5 ? '1d8' : '1d6';
const moxieMax = c => (c.C?.recursosTabla?.[c.lvl - 1] || {}).moxie || 0;
const cdPug = c => 8 + c.pb + c.m.fue;
const golpeU = c => [`1d20${modStr(c.unarmed.atk)}`, c.unarmed.expr];

const REGLAS = [

  {de:/pugilista/, n:/^determinacion/, t:'pasiva',
    texto: c => `Tienes ${moxieMax(c)} puntos de Moxie y los recuperas con un descanso corto o largo. Los gastas en ¡Alístate!, El Viejo Uno-Dos y Pegar y Moverse, que aparecen como acciones adicionales.`,
    opciones: [
      {nombre:'¡Alístate!', t:'adicional', coste:'1 Moxie', texto: c => `Te preparas para recibir golpes: ganas ${dadoPug(c)} + ${c.lvl + c.m.con} PG temporales, que se pierden al pasar 1 minuto.`},
      {nombre:'El Viejo Uno-Dos', t:'adicional', coste:'1 Moxie', roll: golpeU, texto: c => `Justo después de usar Atacar, haces dos golpes sin armas (${c.unarmed.dmg} cada uno).`},
      {nombre:'Pegar y Moverse', t:'adicional', coste:'1 Moxie', texto: c => `Empujas a una criatura (salvación de FUE o DES contra CD ${c.grappleDC}) o usas Correr.`},

      <label class="crop-z">Zoom<input type="range" min="1" max="4" step="0.01" value="${S.crop.zoom}" id="cropZoom"></label>
      <p class="note">Arrastra la imagen para elegir qué parte se ve.</p>
      <div class="row"><button class="btn small" data-act="cropOk">Guardar</button><button class="btn ghost small" data-act="cropNo">Cancelar</button></div></div>`;

      ${LIB.imgOrig?.[k] ? `<button class="btn ghost small" data-cropedit="${esc(k)}">Ajustar recorte</button>` : ''}

      <p class="note">Se guardan en la Biblioteca y viajan con ella cuando la compartes.</p></div></details>`;
  return h + `</div></section>`;
}
function geomCrop(){
  const box = document.getElementById('cropBox'); if (!box || !S.crop) return null;
  const B = box.clientWidth, s = B / Math.min(S.crop.w, S.crop.h) * S.crop.zoom;
  return {B, s};
}
function ajustarCrop(){
  const g = geomCrop(); if (!g) return;
  const c = S.crop, hx = g.B / (2 * g.s * c.w), hy = g.B / (2 * g.s * c.h);
  c.cx = Math.min(1 - hx, Math.max(hx, c.cx)); c.cy = Math.min(1 - hy, Math.max(hy, c.cy));
  const im = document.getElementById('cropImg');
  im.style.width = c.w * g.s + 'px'; im.style.height = c.h * g.s + 'px';
  im.style.left = g.B / 2 - c.cx * c.w * g.s + 'px'; im.style.top = g.B / 2 - c.cy * c.h * g.s + 'px';
}
function cargarImagen(src){ return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }); }
async function empezarCrop(k, file){
  const src = file ? await achicarImagen(file, 640) : LIB.imgOrig[k];
  const im = await cargarImagen(src), prev = !file && LIB.imgCrop?.[k];
  S.crop = {k, src, w:im.naturalWidth, h:im.naturalHeight, zoom: prev?.zoom || 1, cx: prev?.cx ?? 0.5, cy: prev?.cy ?? 0.5};
  render();
}
async function guardarCrop(){
  const c = S.crop, im = await cargarImagen(c.src), lado = Math.min(c.w, c.h) / c.zoom, N = 320;
  const cv = document.createElement('canvas'); cv.width = N; cv.height = N;
  cv.getContext('2d').drawImage(im, c.cx * c.w - lado / 2, c.cy * c.h - lado / 2, lado, lado, 0, 0, N, N);
  LIB.img = LIB.img || {}; LIB.imgOrig = LIB.imgOrig || {}; LIB.imgCrop = LIB.imgCrop || {};
  LIB.img[c.k] = cv.toDataURL('image/jpeg', 0.82); LIB.imgOrig[c.k] = c.src; LIB.imgCrop[c.k] = {zoom:c.zoom, cx:c.cx, cy:c.cy};
  S.crop = null; saveLib(); render(); toast('Imagen guardada.');
}
function especieCard(k, e, on){
  const img = LIB.img?.[k], d = k === 'custom' ? e.r : (descEspecie(k) || (e.lib ? 'De tu biblioteca' : e.r));
  return `<button class="card esp${on ? ' on' : ''}" data-especie="${esc(k)}" data-q="${esc(norm(e.n + ' ' + d))}">${img ? `<img src="${img}" alt="">` : ''}<b>${esc(e.n)}</b><span class="d">${esc(d)}</span></button>`;
}
function achicarImagen(file, max = 320){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => { const s = Math.min(1, max / Math.max(im.width, im.height)); const cv = document.createElement('canvas'); cv.width = Math.round(im.width * s); cv.height = Math.round(im.height * s); cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); res(cv.toDataURL('image/jpeg', 0.8)); }; im.onerror = rej; im.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

function setPath(o, path, v){ const ks = path.split('.'); let x = o; for (let i = 0; i < ks.length - 1; i++) { if (x[ks[i]] == null || typeof x[ks[i]] !== 'object') x[ks[i]] = {}; x = x[ks[i]]; } x[ks[ks.length - 1]] = v; }
function setVal(path, v){
  const pj = S.pj;
  setPath(pj, path, v);
  if (path === 'nivel') pj.nivel = +v;
  if (/^mejoras\.\d+\.modo$/.test(path)) { const L = path.split('.')[1]; pj.mejoras[L] = {modo:v}; }
  if (path === 'trasfondo.a' && pj.trasfondo.b === v) pj.trasfondo.b = '';
  if (/^pgTiradas\.\d+$/.test(path)) { asegurarTiradas(pj); const i = +path.split('.')[1], die = getC(pj, pj.clase)?.dado || 8; pj.pgTiradas[i] = v ? Math.min(die, Math.max(1, Math.round(v))) : null; }
  savePj(); render();
}
function tirarCaracteristica(){
  const g = S.pj.gen; if (g.valores.length >= 6) return Promise.resolve();
  return Dice.roll('4d6', `Característica ${g.valores.length + 1} de 6`, {keep:3, neutral:true, noRepeat:true}).then(r => {
    g.valores.push(r.total); g.dados = g.dados || []; g.dados.push(r.groups[0].vals); savePj(); render();
  });
}
function resumenNuevo(lista){
  if (!lista.length) return '';
  const cuenta = {}; lista.forEach(s => { const t = s.split(' ')[0]; cuenta[t] = (cuenta[t] || 0) + 1; });
  const pl = {clase:'clases', subclase:'subclases', especie:'especies', trasfondo:'trasfondos', dote:'dotes', conjuro:'conjuros', imagen:'imágenes'};
  return ' A la biblioteca: ' + Object.entries(cuenta).map(([t, n]) => `${n} ${n > 1 ? pl[t] : t}`).join(', ') + '.';
}
function importar(text, archivo){
  let d; try { d = JSON.parse(text); } catch (e) { return {error:true}; }
  if (d && d.tipo === 'miturno-biblioteca') { const n = mezclarContenido(d); const fuera = limpiarBestias(); saveLib(); return {lib:true, nuevo:n.filter(s => !fuera.includes(s.replace(/^especie /, '')))}; }
  let pj, nuevo = [];
  if (!(d && (d.v === 2 || d.stats))) { const n = aprenderPaquete(d, archivo); if (n) { saveLib(); return {lib:true, nuevo:n}; } }
  if (d && d.v === 2 && d.gen) { nuevo = mezclarContenido(d.contenido); pj = reparar(d); }
  else if (d && d.stats && (d.classes || d.class)) { nuevo = aprenderBuilder(d); pj = convertBuilder(d); }
  else return {error:true};
  saveLib();
  S.pj = pj; pj.used = pj.used || {}; savePj();
  return {pj, nuevo};
}
async function leerArchivos(files){
  files = [...(files || [])]; if (!files.length) return;
  const nuevo = [], pjs = []; let errores = 0, libs = 0;
  for (const f of files) {
    const text = await f.text().catch(() => null);
    const r = text == null ? {error:true} : importar(text, f.name);
    if (r?.error) errores++; else { nuevo.push(...(r.nuevo || [])); if (r.pj) pjs.push(r.pj); if (r.lib) libs++; }
  }
  if (S.importCamp && pjs.length) { const cp = camps().find(x => x.id === S.importCamp); if (cp) { pjs.forEach(p => { if (!cp.pjs.includes(p.id)) cp.pjs.push(p.id); }); guardarCamp(cp); } S.camp = S.importCamp; S.view = 'mesa'; S.mtab = 'grupo'; S.pj = pjs[pjs.length - 1]; }
  else if (pjs.length) { S.pj = pjs[pjs.length - 1]; S.view = pjs.length === 1 ? 'ficha' : 'home'; S.tab = 'turno'; }
  else if (libs) S.view = 'lib';
  S.importCamp = null;
  render(); window.scrollTo(0, 0);
  const partes = [];
  if (pjs.length) partes.push(pjs.length === 1 ? `${pjs[0].nombre || 'Personaje'} importado.` : `${pjs.length} personajes importados.`);
  if (libs && !pjs.length) partes.push(nuevo.length ? 'Biblioteca actualizada.' : 'Esa biblioteca no trae nada nuevo.');
  if (nuevo.length) partes.push(resumenNuevo(nuevo).trim());
  if (errores) partes.push(`${errores} archivo${errores > 1 ? 's' : ''} no ${errores > 1 ? 'son' : 'es'} de personajes ni de contenido (armas, bestiario y similares se ignoran).`);
  toast(partes.join(' '));
}

function onChange(e){
  const t = e.target, pj = S.pj;
  if (S.view === 'mesa' && onChangeMesa(t)) return;
  if (t.dataset.descesp) { LIB.desc = LIB.desc || {}; LIB.desc[t.dataset.descesp] = t.value.trim(); saveLib(); render(); return; }
  if (t.dataset.imgesp && t.files?.[0]) { empezarCrop(t.dataset.imgesp, t.files[0]).catch(() => toast('No se pudo leer esa imagen.')); return; }
  if (t.dataset.sptodos != null) { S.spTodos = t.checked; render(); return; }
  if (t.dataset.draft) { setPath(S.draft, t.dataset.draft, t.type === 'number' ? +t.value : t.value); return; }
  if (!pj) return;
  if (t.dataset.poolin) { const max = +t.dataset.max, v = Math.min(max, Math.max(0, parseInt(t.value) || 0)); pj.used[t.dataset.poolin] = max - v; savePj(); render(); return; }
  if (t.dataset.toggle) { const f = t.dataset.toggle, v = t.dataset.v, max = +t.dataset.max, arr = pj[f] = pj[f] || [];
    if (arr.includes(v)) arr.splice(arr.indexOf(v), 1); else if (arr.length < max) arr.push(v); else { toast(`Solo puedes elegir ${max}.`); t.checked = false; return; }
    savePj(); render(); return; }
  if (t.dataset.mae) { const k = t.dataset.mae, arr = pj.maestrias, max = getC(pj, pj.clase)?.maestrias || 0;
    if (arr.includes(k)) arr.splice(arr.indexOf(k), 1); else if (arr.length < max) arr.push(k); else { toast(`Solo puedes elegir ${max}.`); t.checked = false; return; }
    savePj(); render(); return; }
  if (t.dataset.set) setVal(t.dataset.set, t.type === 'checkbox' ? t.checked : (t.dataset.num != null ? +t.value : t.value));
}

function migrarV1(){

  vieja.forEach(p => { const o = store.get('miturno:pj:' + p.id); if (!o?.data) return;
    try { const pj = convertBuilder(o.data), x = o.extras || {};
      (x.armas || []).forEach(([k, q]) => { const ex = pj.armas.find(a => a[0] === k); if (ex) ex[1] += q; else pj.armas.push([k, q]); });
      if (x.armadura && x.armadura !== 'ninguna') pj.armadura = x.armadura; if (x.escudo) pj.escudo = true;
      S.pj = pj; savePj(); } catch (err) {} });
  S.pj = null; saveLib();
}

  render();

    document.querySelectorAll('.spc').forEach(el => { el.hidden = !!q && !el.dataset.name.includes(q); });
    document.querySelectorAll('.spg').forEach(g => { const hay = [...g.querySelectorAll('.spc')].some(el => !el.hidden); g.hidden = !!q && !hay; g.open = q ? hay : !!S.spOpen?.[g.dataset.spg]; });
  });
  document.addEventListener('toggle', e => { const g = e.target; if (g.classList?.contains('spg') && !document.getElementById('spQ')?.value) { S.spOpen = S.spOpen || {}; S.spOpen[g.dataset.spg] = g.open; } }, true);
  document.addEventListener('click', e => { if (e.target.closest('#dice') || e.target.id === 'diceBack') return; onClick(e); });
  document.getElementById('app').addEventListener('change', onChange);
  document.getElementById('modal').addEventListener('change', onChange);
  document.getElementById('diceBack').addEventListener('click', () => Dice.close());
  document.getElementById('dice').addEventListener('click', e => {
    const b = e.target.closest('[data-dact]'); if (!b) return;
    const r = Dice.cur, o = r.o, a = b.dataset.dact;
    if (a === 'close') Dice.close();

    if (a === 'again') Dice.roll(r.expr, r.label, o);
    if (a === 'dmg' || a === 'crit') Dice.roll(o.dmg, o.dmgLabel || 'Daño', {min3:o.dmgMin3, crit: a === 'crit'});
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') Dice.close(); });
  document.addEventListener('pointerdown', e => { const box = e.target.closest('#cropBox'); if (!box || !S.crop) return; e.preventDefault(); box.setPointerCapture?.(e.pointerId); S.crop.drag = {x:e.clientX, y:e.clientY}; });
  document.addEventListener('pointermove', e => { if (!S.crop?.drag) return; const g = geomCrop(); if (!g) return; S.crop.cx -= (e.clientX - S.crop.drag.x) / (S.crop.w * g.s); S.crop.cy -= (e.clientY - S.crop.drag.y) / (S.crop.h * g.s); S.crop.drag = {x:e.clientX, y:e.clientY}; ajustarCrop(); });
  document.addEventListener('pointerup', () => { if (S.crop) S.crop.drag = null; });
  document.getElementById('app').addEventListener('input', e => { if (e.target.id === 'cropZoom' && S.crop) { S.crop.zoom = +e.target.value; ajustarCrop(); } });
  window.addEventListener('resize', () => { if (S.crop) ajustarCrop(); });
  const drop = document.body;
  drop.addEventListener('dragover', e => e.preventDefault());
  drop.addEventListener('drop', e => { e.preventDefault(); leerArchivos(e.dataTransfer.files); });
  if (window.claude?.use) window.claude.use('downloads').then(x => { S.dl = x; if (x && (S.view === 'ficha' || S.view === 'lib')) render(); }).catch(() => {});

/* ============ Mesa del DM (campañas y combate, local) ============ */
const CONDICIONES = ['Agarrado','Apresado','Asustado','Aturdido','Cegado','Derribado','Ensordecido','Envenenado','Hechizado','Incapacitado','Inconsciente','Invisible','Paralizado','Petrificado','Agotamiento','Concentrado'];
const camps = () => store.get('miturno2:campanas') || [];
const campActual = () => camps().find(x => x.id === S.camp) || null;
function guardarCamp(cp){ const l = camps(), i = l.findIndex(x => x.id === cp.id); if (i >= 0) l[i] = cp; else l.push(cp); store.set('miturno2:campanas', l); }
function cargarPj(id){ const p = store.get('miturno2:pj:' + id); return p ? reparar(p) : null; }
function combatiente(k, cp){
  if (k.startsWith('pj:')) {
    const pj = cargarPj(k.slice(3)); if (!pj) return null;
    const c = compute(pj), usado = Math.min(pj.used?.pg || 0, c.hpMax);
    return {k, tipo:'pj', nombre: pj.nombre || 'Sin nombre', ca:c.ac, pgMax:c.hpMax, pg:c.hpMax - usado, bono:c.init, c, pj};
  }
  const m = (cp.monstruos || []).find(x => x.id === k.slice(2));
  return m ? {k, tipo:'m', nombre:m.nombre, ca:m.ca, pgMax:m.pgMax, pg:m.pg, bono:m.bono, m} : null;
}
function cambiarPg(cp, k, delta){
  if (k.startsWith('pj:')) {
    const pj = cargarPj(k.slice(3)); if (!pj) return;
    const c = compute(pj); pj.used = pj.used || {};
    pj.used.pg = Math.min(c.hpMax, Math.max(0, (pj.used.pg || 0) - delta));
    store.set('miturno2:pj:' + pj.id, pj);
    if (S.pj?.id === pj.id) S.pj.used.pg = pj.used.pg;
    if (c.hpMax - pj.used.pg > 0) { const e = cp.estado?.[k]; if (e) e.muerte = {e:0, f:0}; }
  } else {
    const m = cp.monstruos.find(x => x.id === k.slice(2)); if (m) m.pg = Math.min(m.pgMax, Math.max(0, m.pg + delta));
  }
}
const estadoDe = (cp, k) => { cp.estado = cp.estado || {}; return cp.estado[k] = cp.estado[k] || {cond:[], muerte:{e:0, f:0}}; };
function ordenar(cp){
  const cur = cp.combate.orden[cp.combate.turno]?.k;
  cp.combate.orden.sort((a, b) => b.init - a.init || b.bono - a.bono);
  const i = cp.combate.orden.findIndex(o => o.k === cur); cp.combate.turno = i >= 0 ? i : 0;
}

function condHTML(cp, k){
  const e = estadoDe(cp, k);
  return `<div class="conds">${e.cond.map(n => `<button class="cond on" data-cond="${esc(k)}|${esc(n)}" title="Quitar">${esc(n)} ×</button>`).join('')}
    <details class="cond-add"><summary>+ Condición</summary><div class="conds">${CONDICIONES.filter(n => !e.cond.includes(n)).map(n => `<button class="cond" data-cond="${esc(k)}|${esc(n)}">${n}</button>`).join('')}</div></details></div>`;
}
function pgHTML(x){
  const pct = x.pgMax ? Math.max(0, Math.min(100, Math.round(100 * x.pg / x.pgMax))) : 0;
  return `<div class="pgbar"><span style="width:${pct}%" class="${pct <= 25 ? 'baja' : pct <= 50 ? 'media' : ''}"></span></div>
    <div class="pgctl"><b>${x.pg}</b><span class="note">/ ${x.pgMax} PG</span>
    <input type="number" inputmode="numeric" min="0" placeholder="0" id="amt-${esc(x.k)}" aria-label="Cantidad">
    <button class="btn small" data-hp="${esc(x.k)}" data-d="dano">Daño</button><button class="btn ghost small" data-hp="${esc(x.k)}" data-d="cura">Curar</button></div>`;
}
function muerteHTML(cp, x){
  if (x.tipo !== 'pj' || x.pg > 0) return '';
  const m = estadoDe(cp, x.k).muerte;
  const pips = (t, n) => Array.from({length:3}, (_, i) => `<button class="pip sm${i < n ? '' : ' used'}${t === 'f' ? ' f' : ''}" data-ds="${esc(x.k)}|${t}|${i}" aria-label="${t === 'e' ? 'Éxito' : 'Fallo'} ${i + 1}"></button>`).join('');
  return `<div class="muerte"><span>A 0 PG.</span><span>Éxitos</span><div class="pips">${pips('e', m.e)}</div><span>Fallos</span><div class="pips">${pips('f', m.f)}</div>${rb('1d20', `Salvación contra muerte de ${x.nombre}`, 'Tirar', 'wide')}</div>`;
}
function tarjetaPj(cp, x){
  const c = x.c, pj = x.pj;
  const subN = c.SD ? c.SD.n : '';
  return `<article class="mcard"><header><div><h3>${esc(x.nombre)}</h3><p class="note">${esc(resumen(pj))}${subN ? `, ${esc(subN)}` : ''}${pj.jugador ? `. Juega ${esc(pj.jugador)}` : ''}</p></div>
      <button class="btn ghost small" data-open="${esc(pj.id)}">Hoja</button></header>
    <div class="mstats"><div><b>${x.ca}</b><span>CA</span></div><div><b>${c.passive}</b><span>Percepción pasiva</span></div><div><b>${10 + c.skill.perspicacia}</b><span>Perspicacia pasiva</span></div><div><b>${10 + c.skill.investigacion}</b><span>Investigación pasiva</span></div><div><b>${sign(c.init)}</b><span>Iniciativa</span></div><div><b>${c.speed}</b><span>Pies</span></div>${c.dcSpell ? `<div><b>${c.dcSpell}</b><span>CD conjuros</span></div>` : ''}</div>
    ${pgHTML(x)}${muerteHTML(cp, x)}${condHTML(cp, x.k)}
    <button class="btn ghost small quitar" data-campquitar="${esc(pj.id)}">Sacar de la campaña</button></article>`;
}
function vMesa(){
  const l = camps();
  if (!S.camp || !campActual()) {
    S.camp = null;
    return `<section class="hero"><h1>Mesa del DM</h1><p class="who">Junta las hojas de tu grupo en una campaña para ver de un vistazo PG, CA y pasivas, y llevar el combate: iniciativa, daño y condiciones.</p></section>
      <div class="plist">${l.map(cp => `<button class="card" data-campopen="${esc(cp.id)}"><b>${esc(cp.nombre)}</b><span>${cp.pjs.length} personaje${cp.pjs.length === 1 ? '' : 's'}${cp.combate?.activo ? ', en combate' : ''}</span></button>`).join('')}</div>
      <div class="form"><label>Nueva campaña<input type="text" id="campN" placeholder="Nombre de la campaña"></label><button class="btn" data-act="nuevaCamp" style="align-self:flex-start">Crear campaña</button></div>`;
  }
  const cp = campActual();
  cp.combate = cp.combate || {activo:false, ronda:1, turno:0, orden:[]}; cp.monstruos = cp.monstruos || [];
  const grupo = cp.pjs.map(id => combatiente('pj:' + id, cp)).filter(Boolean);
  const fuera = S.list.filter(p => !cp.pjs.includes(p.id));
  let h = `<section class="hero"><h1>${esc(cp.nombre)}</h1><p class="who">${grupo.length} personaje${grupo.length === 1 ? '' : 's'}. Los cambios quedan en las copias de este dispositivo; no llegan al celular de cada jugador.</p></section>`;
  h += `<nav class="tabs">${[['grupo','Grupo'],['combate', cp.combate.activo ? `Combate, ronda ${cp.combate.ronda}` : 'Combate']].map(([k, n]) => `<button class="tab" data-mtab="${k}" aria-selected="${(S.mtab || 'grupo') === k}">${n}</button>`).join('')}</nav>`;
  if ((S.mtab || 'grupo') === 'grupo') {
    h += grupo.length ? `<div class="mgrid">${grupo.map(x => tarjetaPj(cp, x)).join('')}</div>` : '<p class="note" style="margin-top:18px">Todavía no hay personajes en esta campaña.</p>';
    h += `<h2 class="plain">Agregar personajes</h2>`;
    if (fuera.length) h += `<div class="checks" id="campAddList">${fuera.map(p => `<label class="check"><input type="checkbox" value="${esc(p.id)}">${esc(p.name)} <span class="note">${esc(p.sub || '')}</span></label>`).join('')}</div><button class="btn" data-act="campAdd">Agregar seleccionados</button>`;
    h += `<p class="note">Pide a cada jugador su respaldo (en su hoja: Guardar respaldo) e impórtalos aquí; se agregan solos a la campaña.</p><button class="btn ghost" data-act="campImport">Importar hojas de jugadores</button>`;
    h += `<div class="row" style="margin-top:28px"><button class="btn ghost small" data-act="campDel">Borrar campaña</button></div>`;
    return h;
  }
  // Combate
  const cb = cp.combate;
  const monForm = `<details class="more"${cb.activo ? '' : ' open'}><summary>Agregar enemigos</summary><div class="form">
      <label>Nombre<input type="text" id="monN" placeholder="Goblin"></label>
      <div class="row"><label>CA<input type="number" id="monCA" value="13"></label><label>PG<input type="number" id="monPG" value="7"></label><label>Bono de iniciativa<input type="number" id="monB" value="2"></label><label>Cuántos<input type="number" id="monQ" value="1" min="1" max="20"></label></div>
      <button class="btn" data-act="addMon" style="align-self:flex-start">Agregar</button></div></details>`;
  if (!cb.activo) {
    h += `<p style="margin-top:18px">Se tira iniciativa para todo el grupo y los enemigos, y se ordena solo. Después puedes corregir cualquier valor.</p>`;
    h += `<div class="list">${cp.monstruos.length ? cp.monstruos.map(m => `<div class="li"><span>${esc(m.nombre)} <span class="note">CA ${m.ca}, ${m.pg}/${m.pgMax} PG, iniciativa ${sign(m.bono)}</span></span><button class="btn ghost small" data-mondel="${esc(m.id)}">Quitar</button></div>`).join('') : '<div class="li"><span class="note">Sin enemigos todavía.</span></div>'}</div>`;
    h += monForm + `<div class="row"><button class="btn" data-act="combIni"${grupo.length || cp.monstruos.length ? '' : ' disabled'}>Empezar combate</button></div>`;
    return h;
  }
  cb.orden = cb.orden.filter(o => combatiente(o.k, cp));
  const actual = cb.orden[cb.turno];
  h += `<div class="row" style="margin-top:14px"><button class="btn" data-act="combNext">Siguiente turno</button><button class="btn ghost" data-act="combFin">Terminar combate</button></div>
    <p class="note">Turno de <b>${esc(actual ? combatiente(actual.k, cp).nombre : '—')}</b>. Ronda ${cb.ronda}.</p>`;
  h += `<div class="orden">${cb.orden.map((o, i) => {
    const x = combatiente(o.k, cp);
    const caido = x.pg <= 0;
    return `<article class="mrow${i === cb.turno ? ' actual' : ''}${caido ? ' caido' : ''}${x.tipo === 'm' ? ' enemigo' : ''}">
      <div class="mrow-h"><div class="ini"><input type="number" value="${o.init}" data-initset="${esc(o.k)}" aria-label="Iniciativa de ${esc(x.nombre)}">${rb(`1d20${modStr(x.bono)}`, `Iniciativa de ${x.nombre}`, 'd20', '', ` data-initroll="${esc(o.k)}"`)}</div>
      <div class="mrow-n"><b>${esc(x.nombre)}</b><span class="note">CA ${x.ca}${x.tipo === 'pj' ? `, percepción pasiva ${x.c.passive}` : ''}</span></div>
      ${x.tipo === 'pj' ? `<button class="btn ghost small" data-open="${esc(x.pj.id)}">Hoja</button>` : `<button class="btn ghost small" data-mondel="${esc(x.m.id)}">Quitar</button>`}</div>
      ${pgHTML(x)}${muerteHTML(cp, x)}${condHTML(cp, x.k)}</article>`;
  }).join('')}</div>` + monForm;
  return h;
}

function onClickMesa(ds, b){
  const cp = campActual();
  if (ds.campopen) { S.camp = ds.campopen; S.mtab = 'grupo'; render(); window.scrollTo(0, 0); return true; }
  if (ds.mtab) { S.mtab = ds.mtab; render(); return true; }
  if (ds.campquitar && cp) { cp.pjs = cp.pjs.filter(i => i !== ds.campquitar); cp.combate.orden = (cp.combate.orden || []).filter(o => o.k !== 'pj:' + ds.campquitar); guardarCamp(cp); render(); return true; }
  if (ds.hp && cp) {
    const v = parseInt(document.getElementById('amt-' + ds.hp)?.value) || 0; if (!v) { toast('Escribe cuánto.'); return true; }
    cambiarPg(cp, ds.hp, ds.d === 'dano' ? -v : v); guardarCamp(cp); render(); return true;
  }
  if (ds.cond && cp) { const [k, n] = ds.cond.split('|'), e = estadoDe(cp, k); e.cond = e.cond.includes(n) ? e.cond.filter(x => x !== n) : [...e.cond, n]; guardarCamp(cp); render(); return true; }
  if (ds.ds && cp) { const [k, t, i] = ds.ds.split('|'), m = estadoDe(cp, k).muerte; m[t] = +i < m[t] ? +i : +i + 1; guardarCamp(cp); render(); return true; }
  if (ds.mondel && cp) { cp.monstruos = cp.monstruos.filter(m => m.id !== ds.mondel); cp.combate.orden = (cp.combate.orden || []).filter(o => o.k !== 'm:' + ds.mondel); guardarCamp(cp); render(); return true; }
  if (ds.initroll && cp) {
    Dice.roll(ds.roll, ds.label, {noRepeat:true}).then(r => { const o = cp.combate.orden.find(o => o.k === ds.initroll); if (o) { o.init = r.total; ordenar(cp); guardarCamp(cp); render(); } });
    return true;
  }
  const act = ds.act, val = id => document.getElementById(id)?.value || '';
  switch (act) {
    case 'mesa': S.view = 'mesa'; S.camp = null; render(); window.scrollTo(0, 0); return true;
    case 'nuevaCamp': { const n = val('campN').trim(); if (!n) { toast('Ponle nombre a la campaña.'); return true; }
      const nueva = {id:'c-' + Date.now().toString(36), nombre:n, pjs:[], monstruos:[], estado:{}, combate:{activo:false, ronda:1, turno:0, orden:[]}};
      guardarCamp(nueva); S.camp = nueva.id; S.mtab = 'grupo'; render(); return true; }
    case 'campAdd': { const ids = [...document.querySelectorAll('#campAddList input:checked')].map(i => i.value); if (!ids.length) { toast('Marca al menos uno.'); return true; }
      cp.pjs.push(...ids.filter(i => !cp.pjs.includes(i))); guardarCamp(cp); render(); return true; }
    case 'campImport': S.importCamp = S.camp; document.getElementById('fileIn').click(); return true;
    case 'campDel': if (confirm(`¿Borrar la campaña ${cp.nombre}? Los personajes no se borran.`)) { store.set('miturno2:campanas', camps().filter(x => x.id !== cp.id)); S.camp = null; render(); } return true;
    case 'addMon': { const n = val('monN').trim() || 'Enemigo', q = Math.min(20, Math.max(1, +val('monQ') || 1)), pg = Math.max(1, +val('monPG') || 1);
      for (let i = 0; i < q; i++) {
        const m = {id: Date.now().toString(36) + i, nombre: q > 1 ? `${n} ${i + 1}` : n, ca: +val('monCA') || 10, pgMax: pg, pg, bono: +val('monB') || 0};
        cp.monstruos.push(m);
        if (cp.combate.activo) { cp.combate.orden.push({k:'m:' + m.id, init: rnd(20) + m.bono, bono:m.bono}); }
      }
      if (cp.combate.activo) ordenar(cp);
      guardarCamp(cp); render(); toast(`${q > 1 ? q + ' enemigos agregados' : n + ' agregado'}.`); return true; }
    case 'combIni': {
      const orden = [...cp.pjs.map(id => 'pj:' + id), ...cp.monstruos.map(m => 'm:' + m.id)].map(k => combatiente(k, cp)).filter(Boolean).map(x => ({k:x.k, init: rnd(20) + x.bono, bono:x.bono}));
      cp.combate = {activo:true, ronda:1, turno:0, orden}; ordenar(cp); cp.combate.turno = 0;
      guardarCamp(cp); render(); window.scrollTo(0, 0); toast('Iniciativa tirada para todos.'); return true; }
    case 'combNext': { const cb = cp.combate; if (!cb.orden.length) return true; cb.turno++; if (cb.turno >= cb.orden.length) { cb.turno = 0; cb.ronda++; } guardarCamp(cp); render(); return true; }
    case 'combFin': { const quitar = cp.monstruos.length && confirm('¿Quitar también a los enemigos?');
      cp.combate = {activo:false, ronda:1, turno:0, orden:[]}; if (quitar) cp.monstruos = []; guardarCamp(cp); render(); return true; }
  }
  return false;
}
function onChangeMesa(t){
  if (!t.dataset.initset) return false;
  const cp = campActual(); if (!cp) return true;
  const o = cp.combate.orden.find(o => o.k === t.dataset.initset); if (o) { o.init = +t.value || 0; ordenar(cp); guardarCamp(cp); render(); }
  return true;
}

if (typeof document !== 'undefined' && document.getElementById('app')) init();
if (typeof module !== 'undefined') module.exports = {compute, convertBuilder, nuevoPj, resolver, parseRoll, aprenderBuilder, getLIB: () => LIB, snapshot, mezclarContenido};

</script>
